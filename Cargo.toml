[package]
name = "satori"
version = "1.0.0"
edition = "2024"
description = "Wayland screen translator for manga and visual novels"
license = "MIT"
repository = "https://github.com/oodenX/satori"
readme = "README.md"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:gtk4-layer-shell", "dep:libadwaita", "dep:libc"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
gtk4 = { version = "0.9", optional = true }
gtk4-layer-shell = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
libadwaita = { version = "0.7", optional = true }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[package.metadata.deb]
depends = "libgtk-4-1, libadwaita-1-0, libgtk4-layer-shell0, slurp, grim"
section = "utils"
extended-description = "Satori captures a user-selected screen region via slurp/grim, sends the image to a Vision LLM for OCR and translation, and renders the result in a floating GTK4 overlay window."

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/satori", dest = "/usr/bin/satori", mode = "0755" },
]

[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
gtk4-layer-shell = "*"
slurp = "*"
grim = "*"
